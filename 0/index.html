<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid - Three.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            z-index: 100;
        }
        #ui span {
            margin-right: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #startScreen, #gameOverScreen, #winScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            backdrop-filter: blur(10px);
        }
        .screen-title {
            font-size: 64px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255,107,107,0.3);
        }
        .screen-subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        .btn:active {
            transform: translateY(0);
        }
        .hidden {
            display: none !important;
        }
        #tutorial {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: center;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 10px 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="gameContainer"></div>

    <div id="ui">
        <span>🏆 Pontuação: <span id="score">0</span></span>
        <span>❤️ Vidas: <span id="lives">3</span></span>
        <span>🎯 Nível: <span id="level">1</span></span>
        <span>💎 Joias: <span id="gems">0</span></span>
    </div>

    <div id="startScreen">
        <div class="screen-title">🎮 ARKANOID 3D</div>
        <div class="screen-subtitle">Derrote os ladrões e recupere as joias!</div>
        <button class="btn" onclick="startGame()">JOGAR</button>
        <div class="screen-subtitle" style="margin-top: 20px;">🖱️ Mova o mouse para controlar o paletão</div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="screen-title" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24);">GAME OVER</div>
        <div class="screen-subtitle">Pontuação Final: <span id="finalScore">0</span></div>
        <button class="btn" onclick="restartGame()">Tentar Novamente</button>
    </div>

    <div id="winScreen" class="hidden">
        <div class="screen-title" style="background: linear-gradient(135deg, #51cf66, #20bf6b);">VOCÊ VENCEU! 🎉</div>
        <div class="screen-subtitle">Pontuação Final: <span id="winScore">0</span></div>
        <button class="btn" onclick="restartGame()">Jogar Novamente</button>
    </div>
