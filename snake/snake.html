<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Cobrinha 🐍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        h1 {
            color: #4ecca5;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(78, 204, 165, 0.5);
        }

        .score-board {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #fff;
        }

        .score-board span {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(78, 204, 165, 0.3);
        }

        #gameCanvas {
            border: 3px solid #4ecca5;
            border-radius: 10px;
            background: #16213e;
            box-shadow: 0 0 30px rgba(78, 204, 165, 0.2);
        }

        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 8px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(145deg, #4ecca5, #3d9e85);
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(78, 204, 165, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(78, 204, 165, 0.3);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .btn:active {
            background: linear-gradient(145deg, #3d9e85, #2e7d6b);
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.95);
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #4ecca5;
            box-shadow: 0 0 50px rgba(78, 204, 165, 0.3);
            display: none;
            z-index: 100;
        }

        .message h2 {
            color: #4ecca5;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .message p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .message button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #4ecca5;
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message button:hover {
            transform: scale(1.05);
        }

        .high-score {
            color: #ffd700;
        }

        .instructions {
            margin-top: 10px;
            color: #888;
            font-size: 0.85rem;
            text-align: center;
        }

        .instructions span {
            display: inline-block;
            background: rgba(78, 204, 165, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
            margin: 2px;
            color: #4ecca5;
        }
    </style>
</head>
<body>

    <h1>🐍 Jogo da Cobrinha</h1>

    <div class="score-board">
        <span>🍎 Pontuação: <span id="score">0</span></span>
        <span>🏆 Recorde: <span id="highScore" class="high-score">0</span></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <button class="btn btn-up" id="btnUp">⬆️</button>
        <button class="btn btn-left" id="btnLeft">⬅️</button>
        <button class="btn btn-down" id="btnDown">⬇️</button>
        <button class="btn btn-right" id="btnRight">➡️</button>
    </div>

    <div class="instructions">
        <span>⬆️⬇️⬅️➡️</span> ou <span>WASD</span> ou <span>Setas</span> para mover
    </div>

    <div class="message" id="messageBox">
        <h2 id="messageTitle">Game Over!</h2>
        <p id="messageText">Pontuação final: 0</p>
        <button onclick="initGame()">Jogar Novamente</button>
    </div>

    <script>
        // Configurações do jogo
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const gameSpeed = 100; // ms por frame

        // Estado do jogo
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let isGameOver = false;
        let lastTime = 0;

        // Elementos DOM
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const messageBox = document.getElementById('messageBox');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');

        highScoreEl.textContent = highScore;

        // Inicializar jogo
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            isGameOver = false;
            scoreEl.textContent = score;
            messageBox.style.display = 'none';
            spawnFood();
            lastTime = performance.now();
        }

        // Gerar comida em posição aleatória
        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (isOnSnake(food.x, food.y));
        }

        // Verificar se posição está na cobra
        function isOnSnake(x, y) {
            return snake.some(segment => segment.x === x && segment.y === y);
        }

        // Desenhar o jogo
        function draw() {
            // Limpar canvas
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar grid (opcional, para visual retro)
            ctx.strokeStyle = 'rgba(78, 204, 165, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Desenhar comida
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Desenhar cobra
            snake.forEach((segment, index) => {
                const gradient = index === 0 ? '#4ecca5' : '#3d9e85';
                ctx.fillStyle = gradient;
                ctx.shadowColor = gradient;
                ctx.shadowBlur = index === 0 ? 10 : 0;
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2,
                    index === 0 ? 6 : 3
                );
                ctx.fill();

                // Olhos na cabeça
                if (index === 0) {
                    ctx.fillStyle = '#1a1a2e';
                    const eyeOffset = 5;
                    const eyeSize = 3;
                    const eyeX1 = segment.x * gridSize + eyeOffset;
                    const eyeY1 = segment.y * gridSize + 6;
                    const eyeX2 = segment.x * gridSize + gridSize - eyeOffset - eyeSize;
                    const eyeY2 = segment.y * gridSize + 6;
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;
        }

        // Atualizar lógica do jogo
        function update() {
            direction = nextDirection;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Colisão com paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Colisão com o próprio corpo
            if (isOnSnake(head.x, head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Comer comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        // Game Over
        function gameOver() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            messageTitle.textContent = 'Game Over!';
            messageText.textContent = `Pontuação: ${score} | Recorde: ${highScore}`;
            messageBox.style.display = 'block';
        }

        // Loop do jogo
        function gameLoopCallback(timestamp) {
            if (!isGameOver) {
                const deltaTime = timestamp - lastTime;
                if (deltaTime >= gameSpeed) {
                    update();
                    draw();
                    lastTime = timestamp;
                }
            }
            requestAnimationFrame(gameLoopCallback);
        }

        // Controles de teclado
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // Controles de toque (botões na tela)
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        const handleTouch = (dir) => (e) => {
            e.preventDefault();
            if (isGameOver) return;
            switch (dir) {
                case 'up':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        };

        btnUp.addEventListener('touchstart', handleTouch('up'));
        btnDown.addEventListener('touchstart', handleTouch('down'));
        btnLeft.addEventListener('touchstart', handleTouch('left'));
        btnRight.addEventListener('touchstart', handleTouch('right'));

        // Suporte a touch no canvas também
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const dx = x - centerX;
            const dy = y - centerY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (absDx > absDy) {
                if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
        }, { passive: false });

        // Iniciar
        initGame();
        draw();
        requestAnimationFrame(gameLoopCallback);
    </script>
</body>
</html>
